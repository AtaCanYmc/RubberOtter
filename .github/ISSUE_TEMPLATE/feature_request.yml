name: Feature Request
description: Propose a new feature or protocol extension
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Firmware (ATmega32U4)
        - Python SDK / CLI / MCP Server
        - Caterina Web Serial Flasher (site/)
        - Protocol / Docs
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What problem does this solve and what is the proposed interface?
    validations:
      required: true
