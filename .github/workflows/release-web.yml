name: Release - Web PWA Package

on:
  push:
    tags:
      - 'web-v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. web-v2.3.0)'
        required: false
        default: ''
      release_title:
        description: 'Release Title (e.g. web: v2.3.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release-web:
    name: Build & Release Web PWA Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        run: cd web && npm ci

      - name: Build Web PWA Bundle
        run: cd web && npm run build

      - name: Package Web Offline Bundle
        run: |
          mkdir -p dist/web
          cd web/dist
          zip -rq ../../dist/web/RubberOtter-Web-PWA.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rubberotter-web-pwa
          path: dist/web/RubberOtter-Web-PWA.zip

      - name: Create or Update Web Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: ${{ inputs.release_title || (inputs.tag_name != '' && inputs.tag_name || github.ref_name) }}
          generate_release_notes: true
          files: dist/web/RubberOtter-Web-PWA.zip
