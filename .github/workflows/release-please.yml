name: Release Please

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: 'Build and publish rubberotter to PyPI immediately'
        type: boolean
        default: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  upload-firmware:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ATmega32U4 Firmware
        working-directory: firmware
        run: pio run

      - name: Upload Firmware Assets to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          HEX_FILES=$(find firmware/.pio/build -name 'firmware.hex')
          if [ -n "$HEX_FILES" ]; then
            sha256sum $HEX_FILES > SHA256SUMS-firmware.txt
            gh release upload "$TAG_NAME" $HEX_FILES SHA256SUMS-firmware.txt --clobber
          fi

  publish-pypi:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true) }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python Unit Tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt
          python -m pip install -e ./python
          python -m unittest discover -s python/tests -p "test_*.py" -v

      - name: Build Python Package (sdist & wheel)
        working-directory: python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

      - name: Attach Python Dist to GitHub Release
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" python/dist/* --clobber
