name: Release Please

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: 'Build and publish rubberotter to PyPI immediately'
        type: boolean
        default: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      python_release_created: ${{ steps.release.outputs['python--release_created'] }}
      python_tag_name: ${{ steps.release.outputs['python--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-pypi:
    needs: release-please
    if: ${{ needs.release-please.outputs.python_release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true) }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.python_tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python Unit Tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt
          python -m pip install -e ./python
          python -m unittest discover -s python/tests -p "test_*.py" -v

      - name: Build Python Package (sdist & wheel)
        working-directory: python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

      - name: Attach Python Dist to GitHub Release
        if: ${{ needs.release-please.outputs.python_release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.python_tag_name }}
        run: gh release upload "$TAG_NAME" python/dist/* --clobber
