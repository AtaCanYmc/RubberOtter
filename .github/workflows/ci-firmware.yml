name: CI - Firmware (PlatformIO)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'firmware/**'
      - '.github/workflows/ci-firmware.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'firmware/**'
      - '.github/workflows/ci-firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-cpp:
    name: Lint C++ (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: clang-format --dry-run --Werror firmware/src/*.cpp firmware/src/*.h

  test-native:
    name: Host Unit Tests (native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Run native unit tests
        run: platformio test -e native

  build:
    name: Build Firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    strategy:
      fail-fast: false
      matrix:
        env: [ "leonardo", "leonardo_hid", "pro_micro", "pro_micro_hid" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache platformio and pip
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            ~/.platformio/packages
          key: ${{ runner.os }}-platformio-${{ hashFiles('firmware/platformio.ini') }}-v1

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: PlatformIO version
        run: platformio --version

      - name: Build (env = ${{ matrix.env }})
        run: |
          set -e
          echo "Building environment: ${{ matrix.env }}"
          platformio run -e ${{ matrix.env }}

      - name: PlatformIO check (static analysis)
        run: |
          platformio check -e ${{ matrix.env }} || true

      - name: Show firmware size
        run: |
          echo "### Firmware Size (${{ matrix.env }})" >> "$GITHUB_STEP_SUMMARY"
          platformio run -e ${{ matrix.env }} -t size | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Upload compiled firmware artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.env }}
          path: firmware/.pio/build/${{ matrix.env }}/firmware.hex
