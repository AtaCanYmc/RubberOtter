name: CI - Firmware (PlatformIO)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'firmware/**'
      - '.github/workflows/ci-firmware.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'firmware/**'
      - '.github/workflows/ci-firmware.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    strategy:
      fail-fast: false
      matrix:
        env: [ "leonardo", "leonardo_hid", "pro_micro", "pro_micro_hid" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache platformio and pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            ~/.platformio/packages
          key: ${{ runner.os }}-platformio-${{ hashFiles('firmware/platformio.ini') }}-v1

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: PlatformIO version
        run: platformio --version

      - name: Build (env = ${{ matrix.env }})
        run: |
          set -e
          echo "Building environment: ${{ matrix.env }}"
          platformio run -e ${{ matrix.env }}

      - name: PlatformIO check (static analysis)
        run: |
          platformio check -e ${{ matrix.env }} || true

      - name: Show firmware size
        run: |
          platformio run -e ${{ matrix.env }} -t size || true

      - name: Upload compiled firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: firmware/.pio/build/${{ matrix.env }}/firmware.hex
