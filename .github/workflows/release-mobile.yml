name: Release - Build & Attach Mobile Binaries (Android & iOS)

on:
  push:
    tags:
      - 'web-v*.*.*'
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        run: cd web && npm ci

      - name: Build Web PWA
        run: cd web && npm run build

      - name: Sync Capacitor Android
        run: cd web && npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Stage Android Release Artifact
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/android/RubberOtter-Android.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rubberotter-android-apk
          path: dist/android/RubberOtter-Android.apk

      - name: Attach Android APK to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/android/RubberOtter-Android.apk

  build-ios:
    name: Build & Package iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        run: cd web && npm ci

      - name: Build Web PWA
        run: cd web && npm run build

      - name: Sync Capacitor iOS
        run: cd web && npx cap sync ios

      - name: Build iOS App with Xcode
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package iOS ZIP and Unsigned IPA
        run: |
          mkdir -p dist/ios
          cd ios/build/Build/Products/Release-iphoneos
          zip -rq ../../../../../dist/ios/RubberOtter-iOS.app.zip App.app
          mkdir -p Payload
          cp -R App.app Payload/
          zip -rq ../../../../../dist/ios/RubberOtter-iOS-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rubberotter-ios-packages
          path: |
            dist/ios/RubberOtter-iOS.app.zip
            dist/ios/RubberOtter-iOS-unsigned.ipa

      - name: Attach iOS Binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/ios/RubberOtter-iOS.app.zip
            dist/ios/RubberOtter-iOS-unsigned.ipa
