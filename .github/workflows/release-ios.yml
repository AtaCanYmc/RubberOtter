name: Release - iOS Package

on:
  push:
    tags:
      - 'ios-v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. ios-v1.0.0)'
        required: false
        default: ''
      release_title:
        description: 'Release Title (e.g. ios: v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release-ios:
    name: Build & Release iOS App Packages
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        run: cd web && npm ci

      - name: Build Web PWA Bundle
        run: cd web && npm run build

      - name: Sync Capacitor iOS
        run: cd web && npx cap sync ios

      - name: Build iOS App with Xcode
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package iOS ZIP and Unsigned IPA
        run: |
          mkdir -p dist/ios
          cd ios/build/Build/Products/Release-iphoneos
          zip -rq ../../../../../dist/ios/RubberOtter-iOS.app.zip App.app
          mkdir -p Payload
          cp -R App.app Payload/
          zip -rq ../../../../../dist/ios/RubberOtter-iOS-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rubberotter-ios-packages
          path: |
            dist/ios/RubberOtter-iOS.app.zip
            dist/ios/RubberOtter-iOS-unsigned.ipa

      - name: Create or Update iOS Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: ${{ inputs.release_title || (inputs.tag_name != '' && inputs.tag_name || github.ref_name) }}
          generate_release_notes: true
          files: |
            dist/ios/RubberOtter-iOS.app.zip
            dist/ios/RubberOtter-iOS-unsigned.ipa
