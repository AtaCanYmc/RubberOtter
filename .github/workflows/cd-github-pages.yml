name: CD - Deploy Flasher to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'site/**'
      - '.github/workflows/cd-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Static Flasher Site to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact (site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy Artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
