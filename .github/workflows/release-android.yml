name: Release - Android Package

on:
  push:
    tags:
      - 'android-v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. android-v1.0.0)'
        required: false
        default: ''
      release_title:
        description: 'Release Title (e.g. android: v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release-android:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        run: cd web && npm ci

      - name: Build Web PWA Bundle
        run: cd web && npm run build

      - name: Sync Capacitor Android
        run: cd web && npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Stage Android Release Artifact
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/android/RubberOtter-Android.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rubberotter-android-apk
          path: dist/android/RubberOtter-Android.apk

      - name: Create or Update Android Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: ${{ inputs.release_title || (inputs.tag_name != '' && inputs.tag_name || github.ref_name) }}
          generate_release_notes: true
          files: dist/android/RubberOtter-Android.apk
