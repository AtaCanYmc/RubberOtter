<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="otterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#27272a" stroke-width="12"/>
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)"/>

  <!-- Left & Right Ears -->
  <path d="M140 180 C120 160 110 200 130 220 Z" fill="url(#otterGrad)" opacity="0.9"/>
  <path d="M372 180 C392 160 402 200 382 220 Z" fill="url(#otterGrad)" opacity="0.9"/>

  <!-- Otter Head Contour -->
  <path d="M150 220 C150 150, 362 150, 362 220 C370 280, 360 340, 256 360 C152 340, 142 280, 150 220 Z" 
        stroke="url(#otterGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Eyes -->
  <circle cx="206" cy="225" r="16" fill="url(#otterGrad)"/>
  <circle cx="306" cy="225" r="16" fill="url(#otterGrad)"/>
  <circle cx="211" cy="220" r="5" fill="#ffffff"/>
  <circle cx="311" cy="220" r="5" fill="#ffffff"/>

  <!-- Nose & Muzzle (Snout) -->
  <path d="M236 260 L276 260 C282 260 286 266 282 272 L262 300 C259 304 253 304 250 300 L230 272 C226 266 230 260 236 260 Z" fill="url(#otterGrad)"/>
  <path d="M256 302 L256 324 M256 324 C240 334 220 324 220 314 M256 324 C272 334 292 324 292 314" 
        stroke="url(#otterGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Whiskers -->
  <path d="M190 285 L120 275 M190 300 L115 305 M190 315 L125 330" 
        stroke="url(#otterGrad)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <path d="M322 285 L392 275 M322 300 L397 305 M322 315 L387 330" 
        stroke="url(#otterGrad)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>

  <!-- Wireless Bluetooth Signal Wave Radiations (Top Right) -->
  <path d="M375 125 C405 155 405 200 375 230" stroke="#06b6d4" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
  <path d="M410 90 C460 140 460 215 410 265" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
</svg>
