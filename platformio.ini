; PlatformIO project configuration for Rubber Otter
; Default set to Arduino Leonardo because PlatformIO on some systems reports ATmega32U4 boards as 'leonardo'.
; If you have a Pro Micro and PlatformIO supports it in your setup, switch to env 'pro_micro' or set board accordingly.

[platformio]
default_envs = pro_micro

[env:leonardo]
platform = atmelavr
board = leonardo
framework = arduino
monitor_speed = 115200
lib_deps =
  Keyboard
  Mouse
  SoftwareSerial
build_flags =
  -D USE_SOFTSERIAL
  -D BLE_NAME=\"Otter\"

[env:pro_micro]
platform = atmelavr
board = sparkfun_promicro16  ; use sparkfun_promicro8 for 3.3V/8MHz variants
framework = arduino
monitor_speed = 115200
lib_deps =
  Keyboard
  Mouse
  SoftwareSerial
build_flags =
  -D USE_SOFTSERIAL
  -D BLE_NAME=\"Otter\"

; Optional HID-Project enabled environments (define USE_HID_PROJECT and add HID-Project lib)
[env:leonardo_hid]
platform = atmelavr
board = leonardo
framework = arduino
monitor_speed = 115200
build_flags =
  -D USE_SOFTSERIAL
  -D USE_HID_PROJECT
  -D BLE_NAME=\"Otter\"
lib_deps =
  SoftwareSerial
  HID-Project

[env:pro_micro_hid]
platform = atmelavr
board = sparkfun_promicro16  ; use sparkfun_promicro8 for 3.3V/8MHz variants
framework = arduino
monitor_speed = 115200
build_flags =
  -D USE_SOFTSERIAL
  -D USE_HID_PROJECT
  -D BLE_NAME=\"Otter\"
lib_deps =
  SoftwareSerial
  HID-Project

; Optional build flags (uncomment as needed)
; build_flags = -D USE_USB_DEBUG

; If you want to force an upload port, uncomment and set below:
; upload_port = /dev/tty.usbmodemXXXX
