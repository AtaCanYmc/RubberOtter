; PlatformIO project configuration for Rubber Otter
; Assumptions:
; - Board: Pro Micro (ATmega32U4). If your board id differs, change `board` accordingly.
; - Platform: atmelavr, Framework: arduino
; Adjust `upload_port` and uncomment build flags as needed.

[platformio]
default_envs = pro_micro

[env:pro_micro]
platform = atmelavr
board = pro_micro
framework = arduino
monitor_speed = 115200

; Optional build flags (uncomment as needed)
; build_flags = -D USE_USB_DEBUG
; build_flags = -D USE_HID_PROJECT

; Optional library dependencies (uncomment if you want PlatformIO to install them)
; lib_deps =
;  HID-Project

; If you want to force an upload port, uncomment and set below:
; upload_port = /dev/tty.usbmodemXXXX

