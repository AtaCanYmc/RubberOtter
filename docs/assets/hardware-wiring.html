<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RubberOtter Hardware Wiring Schematic</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · RubberOtter</p>
    <h1>ATmega32U4 Hardware Wiring &amp; Level Shifting</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hw-wiring-title hw-wiring-desc">
        <title id="hw-wiring-title">RubberOtter Hardware Wiring Schematic</title>
        <desc id="hw-wiring-desc">Circuit topology connecting the ATmega32U4 microcontroller to the HM-10 BLE module via a 5V to 3.3V resistor divider, a haptic motor driver, and the host USB port.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="24" y="32" width="280" height="400" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="40" y="36" width="124" height="12" rx="2" fill="#f5f5f5"/>
        <text x="102" y="45" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MCU (ATMEGA32U4)</text>

        <rect x="344" y="32" width="280" height="400" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="360" y="36" width="136" height="12" rx="2" fill="#f5f5f5"/>
        <text x="428" y="45" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">INTERFACE &amp; POWER</text>

        <rect x="664" y="32" width="272" height="400" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="680" y="36" width="136" height="12" rx="2" fill="#f5f5f5"/>
        <text x="748" y="45" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PERIPHERALS &amp; HOST</text>

        <!-- Connectors (drawn before nodes) -->
        <!-- UART TX1 -> Voltage Divider -->
        <path d="M 280,224 H 316 Q 324,224 324,216 V 174 Q 324,166 332,166 H 368" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Voltage Divider -> HM-10 RX -->
        <path d="M 600,166 H 636 Q 644,166 644,158 V 126 Q 644,118 652,118 H 688" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- HM-10 TX -> UART RX1 (3.3V direct) -->
        <path d="M 688,92 H 320 Q 312,92 312,100 V 204 Q 312,212 304,212 H 280" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- GPIO Pin 2 -> Driver -->
        <path d="M 280,256 H 316 Q 324,256 324,264 V 290 Q 324,298 332,298 H 368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Driver -> Motor -->
        <path d="M 600,298 H 636 Q 644,298 644,270 V 270 Q 644,262 652,262 H 688" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Power 3.3V / GND -> HM-10 -->
        <path d="M 280,348 H 652 Q 660,348 660,340 V 144 Q 660,136 668,136 H 688" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Micro USB -> Host PC -->
        <line x1="280" y1="376" x2="688" y2="376" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- Arrow Labels -->
        <rect x="448" y="76" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="490" y="85" fill="#2e5aa8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">3.3V TX DIRECT</text>

        <rect x="292" y="180" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="324" y="189" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">5V TX1</text>

        <rect x="612" y="128" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="644" y="137" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">3.3V RX</text>

        <rect x="436" y="360" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="484" y="369" fill="#2e5aa8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">USB HID + 5V PWR</text>

        <!-- Nodes: MCU -->
        <rect x="48" y="72" width="232" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="72" width="232" height="84" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
        <rect x="60" y="82" width="48" height="12" rx="2" fill="#bf4520"/>
        <text x="84" y="91" fill="#ffffff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE MCU</text>
        <text x="60" y="116" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">ATmega32U4</text>
        <text x="60" y="134" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace">Pro Micro / Leonardo 5V</text>

        <rect x="48" y="196" width="232" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="196" width="232" height="84" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="60" y="206" width="56" height="12" rx="2" fill="#ececec"/>
        <text x="88" y="215" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SIGNALS</text>
        <text x="60" y="238" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">UART &amp; GPIO Pins</text>
        <text x="60" y="256" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">RX1(0) · TX1(1) · Pin 2</text>

        <rect x="48" y="320" width="232" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="320" width="232" height="84" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="60" y="330" width="56" height="12" rx="2" fill="#ececec"/>
        <text x="88" y="339" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUS / PWR</text>
        <text x="60" y="362" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Power &amp; USB</text>
        <text x="60" y="380" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">3.3V · GND · Micro USB</text>

        <!-- Nodes: Interface -->
        <rect x="368" y="128" width="232" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="368" y="128" width="232" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="380" y="138" width="68" height="12" rx="2" fill="#ececec"/>
        <text x="414" y="147" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROTECTION</text>
        <text x="380" y="170" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Voltage Divider</text>
        <text x="380" y="188" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">1kΩ + 2kΩ (5V → 3.3V)</text>

        <rect x="368" y="260" width="232" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="368" y="260" width="232" height="76" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="380" y="270" width="52" height="12" rx="2" fill="#ececec"/>
        <text x="406" y="279" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DRIVER</text>
        <text x="380" y="302" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">NPN / MOSFET</text>
        <text x="380" y="320" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">2N2222 Base/Gate Driver</text>

        <!-- Nodes: Peripherals -->
        <rect x="688" y="72" width="224" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="688" y="72" width="224" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="700" y="82" width="48" height="12" rx="2" fill="#ececec"/>
        <text x="724" y="91" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BLE</text>
        <text x="700" y="114" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">HM-10 / BT05</text>
        <text x="700" y="132" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">VCC 3.3V · TX · RX · GND</text>

        <rect x="688" y="224" width="224" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="688" y="224" width="224" height="76" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="700" y="234" width="48" height="12" rx="2" fill="#ececec"/>
        <text x="724" y="243" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HAPTIC</text>
        <text x="700" y="266" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Vibration Motor</text>
        <text x="700" y="284" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">Coin Motor (Active HIGH)</text>

        <rect x="688" y="336" width="224" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="688" y="336" width="224" height="76" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="700" y="346" width="48" height="12" rx="2" fill="#ffffff"/>
        <text x="724" y="355" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="700" y="378" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Target Host PC</text>
        <text x="700" y="396" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">Emulated USB HID</text>

        <!-- Legend -->
        <line x1="24" y1="452" x2="936" y2="452" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <line x1="24" y1="474" x2="48" y2="474" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="56" y="477" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">5V → 3.3V Level-Shifted TX</text>

        <line x1="244" y1="474" x2="268" y2="474" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="276" y="477" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">3.3V Direct / USB HID</text>

        <line x1="444" y1="474" x2="468" y2="474" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="476" y="477" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">3.3V Power / GND</text>
      </svg>
    </div>
  </div>
</body>
</html>
