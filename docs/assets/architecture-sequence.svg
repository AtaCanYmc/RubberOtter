<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-seq-title arch-seq-desc">
        <title id="arch-seq-title">RubberOtter End-to-End Data Flow</title>
        <desc id="arch-seq-desc">Sequence diagram showing framed packet transmission from client through BLE bridge to ATmega32U4 firmware, USB HID report emission, and 6-byte ACK return.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lifelines -->
        <line x1="128" y1="76" x2="128" y2="456" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="368" y1="76" x2="368" y2="456" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="608" y1="76" x2="608" y2="456" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="832" y1="76" x2="832" y2="456" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Activation Bars -->
        <rect x="364" y="116" width="8" height="44" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="604" y="160" width="8" height="220" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="828" y="332" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="364" y="380" width="8" height="44" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- Messages -->
        <!-- 1: Client -> BLE -->
        <line x1="128" y1="116" x2="364" y2="116" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="176" y="100" width="144" height="12" rx="2" fill="#f5f5f5"/>
        <text x="248" y="109" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1. GATT 0xFFE1 WRITE</text>

        <!-- 2: BLE -> MCU -->
        <line x1="372" y1="160" x2="604" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="416" y="144" width="144" height="12" rx="2" fill="#f5f5f5"/>
        <text x="488" y="153" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2. UART 9600 BAUD</text>

        <!-- 3: MCU self-loop (Ring Buffer) -->
        <path d="M 612,196 H 644 Q 652,196 652,204 V 220 Q 652,228 644,228 H 612" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="660" y="206" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="662" y="215" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">3. 512B RING BUFFER</text>

        <!-- 4: MCU self-loop (Validate) -->
        <path d="M 612,256 H 644 Q 652,256 652,264 V 280 Q 652,288 644,288 H 612" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="660" y="266" width="152" height="12" rx="2" fill="#f5f5f5"/>
        <text x="662" y="275" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">4. STX/LEN/XOR/ETX (≤384B)</text>

        <!-- 5: MCU -> Host (Headline) -->
        <line x1="612" y1="332" x2="828" y2="332" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="652" y="316" width="136" height="12" rx="2" fill="#f5f5f5"/>
        <text x="720" y="325" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">5. USB HID REPORT</text>

        <!-- 6: MCU -> BLE (Return) -->
        <line x1="604" y1="380" x2="372" y2="380" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="424" y="364" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="488" y="373" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">6. 6-BYTE ACK [0x02..0x03]</text>

        <!-- 7: BLE -> Client (Return) -->
        <line x1="364" y1="424" x2="128" y2="424" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="176" y="408" width="144" height="12" rx="2" fill="#f5f5f5"/>
        <text x="248" y="417" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">7. GATT 0xFFE1 NOTIFY</text>

        <!-- Actor Boxes -->
        <rect x="32" y="24" width="192" height="52" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <text x="128" y="46" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
        <text x="128" y="62" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RubberDeck / SDK / MCP</text>

        <rect x="272" y="24" width="192" height="52" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <text x="368" y="46" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BLE Bridge</text>
        <text x="368" y="62" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HM-10 / ESP32 GATT</text>

        <rect x="512" y="24" width="192" height="52" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
        <text x="608" y="46" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ATmega32U4</text>
        <text x="608" y="62" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Firmware (16 MHz)</text>

        <rect x="744" y="24" width="176" height="52" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1"/>
        <text x="832" y="46" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Target Host PC</text>
        <text x="832" y="62" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">USB HID Target</text>

        <!-- Legend -->
        <line x1="32" y1="476" x2="928" y2="476" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <line x1="32" y1="498" x2="56" y2="498" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="64" y="501" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">BLE GATT Call</text>

        <line x1="184" y1="498" x2="208" y2="498" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="216" y="501" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Headline HID Emission</text>

        <line x1="384" y1="498" x2="408" y2="498" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="416" y="501" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">ACK Return</text>
      </svg>
