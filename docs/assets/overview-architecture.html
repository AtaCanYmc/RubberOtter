<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RubberOtter Platform Overview</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · RubberOtter</p>
    <h1>Wireless USB HID Platform Overview</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overview-arch-title overview-arch-desc">
        <title id="overview-arch-title">RubberOtter Platform Overview</title>
        <desc id="overview-arch-desc">High-level architecture of RubberOtter connecting RubberDeck PWA, Python SDK/CLI, and MCP Server over BLE or USB Serial to the ATmega32U4 HID firmware and Target Host PC.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="24" y="28" width="248" height="332" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="40" y="32" width="136" height="12" rx="2" fill="#f5f5f5"/>
        <text x="108" y="41" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONTROL INTERFACES</text>

        <rect x="320" y="28" width="320" height="332" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="336" y="32" width="132" height="12" rx="2" fill="#f5f5f5"/>
        <text x="402" y="41" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BRIDGE &amp; FIRMWARE</text>

        <rect x="688" y="28" width="248" height="332" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="704" y="32" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="736" y="41" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TARGET</text>

        <!-- Connectors (drawn before nodes) -->
        <!-- RubberDeck -> BLE Bridge -->
        <path d="M 256,96 H 296 Q 304,96 304,104 V 116 Q 304,124 312,124 H 344" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Python SDK -> BLE Bridge -->
        <path d="M 256,192 H 284 Q 292,192 292,184 V 148 Q 292,140 300,140 H 344" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- MCP Server -> ATmega32U4 (USB CDC / BLE) -->
        <path d="M 256,288 H 296 Q 304,288 304,280 V 268 Q 304,260 312,260 H 344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- BLE Bridge -> ATmega32U4 -->
        <line x1="480" y1="168" x2="480" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ATmega32U4 -> Host PC -->
        <path d="M 616,260 H 652 Q 660,260 660,252 V 200 Q 660,192 668,192 H 704" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Arrow Labels -->
        <rect x="260" y="76" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="298" y="85" fill="#2e5aa8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">BLE GATT</text>

        <rect x="488" y="188" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="530" y="197" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">UART 9600</text>

        <rect x="628" y="216" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="658" y="225" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">USB HID</text>

        <!-- Nodes: Control Interfaces -->
        <rect x="40" y="64" width="216" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="64" width="216" height="64" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="52" y="74" width="48" height="12" rx="2" fill="#ececec"/>
        <text x="76" y="83" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB/APP</text>
        <text x="52" y="104" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">RubberDeck PWA</text>
        <text x="52" y="118" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">Web &amp; Capacitor Mobile</text>

        <rect x="40" y="160" width="216" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="160" width="216" height="64" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="52" y="170" width="48" height="12" rx="2" fill="#ececec"/>
        <text x="76" y="179" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PYTHON</text>
        <text x="52" y="200" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Python SDK &amp; CLI</text>
        <text x="52" y="214" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">rubberotter · otter-cli</text>

        <rect x="40" y="256" width="216" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="256" width="216" height="64" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="52" y="266" width="48" height="12" rx="2" fill="#ececec"/>
        <text x="76" y="275" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AI / MCP</text>
        <text x="52" y="296" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">MCP Server</text>
        <text x="52" y="310" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">13 Hardware AI Tools</text>

        <!-- Nodes: Bridge & Firmware -->
        <rect x="344" y="92" width="272" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="344" y="92" width="272" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="356" y="102" width="48" height="12" rx="2" fill="#ececec"/>
        <text x="380" y="111" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BRIDGE</text>
        <text x="356" y="134" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">HM-10 / ESP32 BLE</text>
        <text x="356" y="152" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">GATT 0xFFE1 · 384B Frame</text>

        <rect x="344" y="220" width="272" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="344" y="220" width="272" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
        <rect x="356" y="230" width="56" height="12" rx="2" fill="#bf4520"/>
        <text x="384" y="239" fill="#ffffff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FIRMWARE</text>
        <text x="356" y="264" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">ATmega32U4</text>
        <text x="356" y="282" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace">C++11 · Parser · Macros · Haptic</text>

        <!-- Nodes: Target -->
        <rect x="704" y="152" width="216" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="152" width="216" height="80" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="716" y="162" width="48" height="12" rx="2" fill="#ffffff"/>
        <text x="740" y="171" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="716" y="194" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Target Host PC</text>
        <text x="716" y="212" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">USB Keyboard &amp; Mouse</text>

        <!-- Legend -->
        <line x1="24" y1="384" x2="936" y2="384" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <rect x="24" y="400" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="44" y="409" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Core Firmware</text>

        <line x1="164" y1="406" x2="188" y2="406" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="196" y="409" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">BLE GATT</text>

        <line x1="276" y1="406" x2="300" y2="406" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="308" y="409" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">USB HID Output</text>
      </svg>
    </div>
  </div>
</body>
</html>
