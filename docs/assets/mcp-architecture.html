<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RubberOtter MCP Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · RubberOtter</p>
    <h1>Model Context Protocol &amp; AI Agent Integration</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcp-arch-title mcp-arch-desc">
        <title id="mcp-arch-title">RubberOtter MCP Architecture</title>
        <desc id="mcp-arch-desc">Flow from AI clients through the RubberOtter stdio MCP server and 13 hardware tools to the ATmega32U4 HID controller and target host PC.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="24" y="32" width="232" height="340" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="40" y="36" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="82" y="45" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AI CLIENTS</text>

        <rect x="304" y="32" width="320" height="340" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="320" y="36" width="144" height="12" rx="2" fill="#f5f5f5"/>
        <text x="392" y="45" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MCP SERVER (STDIO)</text>

        <rect x="672" y="32" width="264" height="340" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="688" y="36" width="108" height="12" rx="2" fill="#f5f5f5"/>
        <text x="742" y="45" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HID HARDWARE</text>

        <!-- Connectors (drawn before nodes) -->
        <!-- Claude -> MCP Server -->
        <path d="M 240,100 H 272 Q 280,100 280,108 V 112 Q 280,120 288,120 H 320" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Cursor -> MCP Server -->
        <path d="M 240,196 H 260 Q 268,196 268,188 V 142 Q 268,134 276,134 H 320" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Agents -> MCP Server -->
        <path d="M 240,292 H 284 Q 292,292 292,284 V 156 Q 292,148 300,148 H 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- MCP Server -> Tools -->
        <line x1="464" y1="172" x2="464" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Tools -> ATmega32U4 -->
        <path d="M 608,262 H 640 Q 648,262 648,254 V 142 Q 648,134 656,134 H 688" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- ATmega32U4 -> Host PC -->
        <line x1="804" y1="172" x2="804" y2="224" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Arrow Labels -->
        <rect x="248" y="84" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="280" y="93" fill="#2e5aa8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MCP STDIO</text>

        <rect x="472" y="192" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="201" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH</text>

        <rect x="614" y="192" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="648" y="201" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BLE / SERIAL</text>

        <rect x="812" y="192" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="836" y="201" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">USB HID</text>

        <!-- Nodes: Clients -->
        <rect x="40" y="68" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="68" width="200" height="64" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="52" y="78" width="42" height="12" rx="2" fill="#ececec"/>
        <text x="73" y="87" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
        <text x="52" y="108" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Claude Desktop</text>
        <text x="52" y="122" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">claude_desktop_config.json</text>

        <rect x="40" y="164" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="164" width="200" height="64" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="52" y="174" width="42" height="12" rx="2" fill="#ececec"/>
        <text x="73" y="183" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IDE</text>
        <text x="52" y="204" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Cursor / Windsurf</text>
        <text x="52" y="218" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">Antigravity · mcp.json</text>

        <rect x="40" y="260" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="260" width="200" height="64" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="52" y="270" width="42" height="12" rx="2" fill="#ececec"/>
        <text x="73" y="279" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="52" y="300" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">LLM Agents</text>
        <text x="52" y="314" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">LangChain · CrewAI · SDK</text>

        <!-- Nodes: MCP Server (Focal) -->
        <rect x="320" y="96" width="288" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="96" width="288" height="76" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
        <rect x="332" y="106" width="56" height="12" rx="2" fill="#bf4520"/>
        <text x="360" y="115" fill="#ffffff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP ENGINE</text>
        <text x="332" y="138" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">rubberotter.mcp.server</text>
        <text x="332" y="156" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace">JSON-RPC 2.0 · stdio transport</text>

        <rect x="320" y="224" width="288" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="224" width="288" height="76" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="332" y="234" width="48" height="12" rx="2" fill="#ececec"/>
        <text x="356" y="243" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOLS</text>
        <text x="332" y="266" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">13 Hardware AI Tools</text>
        <text x="332" y="284" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">type · mouse · media · macro · haptic</text>

        <!-- Nodes: Hardware -->
        <rect x="688" y="96" width="232" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="688" y="96" width="232" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="700" y="106" width="60" height="12" rx="2" fill="#ececec"/>
        <text x="730" y="115" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONTROLLER</text>
        <text x="700" y="138" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">ATmega32U4 + HM-10</text>
        <text x="700" y="156" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">16 MHz · BLE GATT 0xFFE1</text>

        <rect x="688" y="224" width="232" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="688" y="224" width="232" height="76" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="700" y="234" width="48" height="12" rx="2" fill="#ffffff"/>
        <text x="724" y="243" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TARGET</text>
        <text x="700" y="266" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Target Host PC</text>
        <text x="700" y="284" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">Native USB Keyboard &amp; Mouse</text>

        <!-- Legend -->
        <line x1="24" y1="396" x2="936" y2="396" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <rect x="24" y="412" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="44" y="421" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Focal Component</text>

        <line x1="164" y1="418" x2="188" y2="418" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <text x="196" y="421" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">MCP stdio</text>

        <line x1="284" y1="418" x2="308" y2="418" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="316" y="421" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Hardware Dispatch</text>

        <line x1="444" y1="418" x2="468" y2="418" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="476" y="421" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Internal Call</text>
      </svg>
    </div>
  </div>
</body>
</html>
